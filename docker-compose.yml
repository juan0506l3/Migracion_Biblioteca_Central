version: "3.9"

services:

  # ──────────────────────────────────────────────
  # PostgreSQL: Base de datos relacional (legacy)
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: biblioteca_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: biblioteca_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema_sucio.sql:/docker-entrypoint-initdb.d/schema_sucio.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biblioteca_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biblioteca_net

  # ──────────────────────────────────────────────
  # MongoDB: Base de datos NoSQL (destino migración)
  # ──────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: biblioteca_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: biblioteca_nosql
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biblioteca_net

  # ──────────────────────────────────────────────
  # App Python: Orquestador del pipeline
  # ──────────────────────────────────────────────
  app_python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblioteca_pipeline
    restart: "no"
    environment:
      POSTGRES_DB: biblioteca_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MONGO_URI: "mongodb://mongodb:27017/"
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - biblioteca_net
    command: ["python", "main.py"]

# ──────────────────────────────────────────────
# Volúmenes y red virtual
# ──────────────────────────────────────────────
volumes:
  postgres_data:
  mongo_data:

networks:
  biblioteca_net:
    driver: bridge
